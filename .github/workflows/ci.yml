name: CI

on: [push, pull_request]

env:
  npm_config_engine_strict: true
  MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: "node,pnpm"

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
    - name: Setup mise
      uses: jdx/mise-action@v5

    - name: Set up environment
      run: mkdir cdk.tmp
      working-directory: aws/environment-setup
    - name: Set up test environment
      run: cp dummy.env .env
      working-directory: aws/environment-setup

    - name: aws/utils ci
      run: pnpm ci
      working-directory: aws/utils
    - name: aws/utils test
      run: pnpm run test
      working-directory: aws/utils

    - name: aws/env-setup ci
      run: pnpm ci
      working-directory: aws/environment-setup
    - name: aws/env-setup testsynth
      run: pnpm run testsynth
      working-directory: aws/environment-setup
    - name: aws/env-setup test
      run: pnpm run test
      working-directory: aws/environment-setup
    # don't run the actual deploy in the CI, but run everything up to here to get the best idea of whether it works

    # edge code

    - name: "docker-base-image: pnpm ci"
      run: pnpm ci
      working-directory: edge/docker-base-image
    - name: "docker-base-image: test cli"
      run: pnpm run test
      working-directory: edge/docker-base-image
    - name: "docker-base-image: build image"
      run: pnpm run docker:build
      working-directory: edge/docker-base-image
    - name: "docker-base-image: test image"
      run: pnpm run docker:test
      working-directory: edge/docker-base-image

    - name: edge/iot ci
      run: pnpm ci
      working-directory: edge/iot
    - name: edge/iot test
      run: pnpm run test
      working-directory: edge/iot
    - name: Set up environment for docker build
      run: mkdir example-container/app && cp -r *.js* pnpm-*.yaml node_modules example-container/app/
      working-directory: edge/iot
    - name:  edge/iot/example-container build
      run: docker compose build
      working-directory: edge/iot/example-container

    # ui code

    - name: ui ci
      run: pnpm ci
      working-directory: ui
